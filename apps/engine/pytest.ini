[pytest]
testpaths = tests
# O código é montado só-leitura no container de testes: sem cache do pytest.
addopts = -p no:cacheprovider -ra --cov=app --cov-report=term-missing:skip-covered
# APIs obsoletas falham a suíte: uma atualização de dependências não as reintroduz
# em silêncio (E2.5).
filterwarnings =
    error::DeprecationWarning
