# Lint do motor (E2.6). Corre na imagem de testes: `make lint`.
target-version = "py312"
line-length = 100
extend-exclude = ["db"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: `Depends(...)`/`Query(...)` como valor por omissão é o idioma do FastAPI.
ignore = ["B008"]

[lint.isort]
known-first-party = ["app", "tests"]
