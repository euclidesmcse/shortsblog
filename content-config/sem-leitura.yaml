# ShortsBlog — sítios que o motor NÃO lê para a IA (D-070, E14.5j).
#
# Os termos de uso destes sítios proíbem robôs, raspagem, uso do conteúdo por IA ou o uso
# comercial. O feed deles pode continuar ativo, mas só como PAUTA: o motor descobre o assunto
# (título e ligação), não baixa a página nem a entrega ao modelo, e os factos e as citações
# vêm de outras fontes. Vale para o domínio e todos os subdomínios.
#
# Além desta lista, o motor não lê a página de nenhum sítio cujo robots.txt bloqueie os robôs
# de IA a quem o texto é entregue (ClaudeBot, Claude-User, anthropic-ai, GPTBot, ChatGPT-User).
#
# Origem: docs/reviews/E14-termos-feeds-2026-10-20.md (leitura dos termos; não é parecer
# jurídico). Para tirar um sítio daqui é preciso uma licença ou uma leitura nova dos termos.
#
# `rss: false` (opção 2 da D-OPEN-14, D-071): os termos limitam o próprio RSS, ou todo o conteúdo,
# a uso pessoal ou não comercial, ou pedem permissão para qualquer uso comercial. Nem como pauta:
# o feed sai de content-config/feeds/ e scripts/validate_feeds.py recusa-o como candidato.
# Quem só proíbe robôs, raspagem ou IA continua como pauta (sem a marca).
