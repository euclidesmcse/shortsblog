# 23/11/2026 (docs/reviews/E14-feeds-poda-saude-2026-11-23.md): saíram Senado Notícias
# (média 0,7 em 14 dias, generalista), CVM — Notícias (parado: item mais recente com 33 dias;
# fonte só brasileira) e CFA — Market Integrity (parado há 32 dias; o feed do Enterprising
# Investor dá XML inválido). O CFPB passou do Newsroom (parado) para o feed geral «Recent updates».
# Entra o FSB (Basileia, G20): regulação financeira internacional, no lugar da CVM.
# Termos: reprodução só não comercial, com crédito, como o BIS (amarelo; uso pauta + citação).
- name: FSB — Financial Stability Board
  url: https://www.fsb.org/feed/
  tier: oficial
  lang: en
  notes: 'organismo internacional (G20/BIS); termos: reprodução só não comercial — usar como pauta + citação com link, sem reproduzir texto (como o BIS)'
