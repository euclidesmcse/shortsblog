# ShortsBlog — feeds do site "cloud" (E5.3). Gerado por scripts/validate_feeds.py.
# Só contém feeds que passaram a validação (HTTPS, 200, XML válido, item recente
# com link e data). Para acrescentar um feed: pô-lo em candidatos/ e correr o script.
#
# USO (D-013): o RSS serve para DESCOBRIR notícias e CITAR a fonte. Nunca se copia
# o texto nem as imagens do feed; o artigo é escrito de raiz, com atribuição e link.
