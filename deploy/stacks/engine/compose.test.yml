# =========================================================================
#  ShortsBlog — stack EFÉMERA de testes do motor (E2.3)
#
#  Uso:  make -C apps/engine test
#  Projeto `sb-engine-test`: rede própria INTERNA (sem saída para a internet —
#  nenhum teste pode chamar LLM, WordPress ou e-mail reais), dados em tmpfs.
#  Nada aqui toca a stack de produção nem as redes `edge`/`socket_proxy_net`.
#  `make test` destrói o projeto no fim (`down -v` só de sb-engine-test).
# =========================================================================
name: sb-engine-test

x-test-env: &test-env
  ENVIRONMENT: test
  LOG_LEVEL: WARNING
  DATABASE_URL: postgresql+psycopg://sb_test:sb_test@postgres:5432/sb_test
  REDIS_URL: redis://redis:6379/0
  MIGRATIONS_DIR: /app/db/migrations
  MEDIA_DIR: /tmp/media
  SB_API_TOKEN: test-token
  SB_SECRET_KEY: test-secret
  HTTP_MAX_RPS: "0"
  INTERNAL_SCHEDULER_ENABLED: "false"
  COVERAGE_FILE: /tmp/.coverage
  PYTHONDONTWRITEBYTECODE: "1"

services:
  postgres:
    # Mesma imagem da produção (docker-compose.yml) — revisão E2.
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: sb_test
      POSTGRES_USER: sb_test
      POSTGRES_PASSWORD: sb_test
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb_test -d sb_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [test]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ../../../apps/engine
      target: test
    image: sb-engine-test:local
    environment: *test-env
    # Código montado só-leitura: nada que o teste faça altera o repositório.
    volumes:
      - ../../../apps/engine:/app:ro
      # Os ficheiros reais dos sites: os testes validam o que vai para produção.
      - ../../../content-config:/config:ro
    tmpfs:
      - /tmp
    networks: [test]
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  test:
    name: sb-engine-test
    internal: true
