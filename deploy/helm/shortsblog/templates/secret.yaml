{{- include "sb.validate" . -}}
{{- /* Senhas internas: geradas no 1.º install; nos upgrades, as do Secret existente (lookup).
       Sem acesso ao cluster (helm template) o lookup volta vazio e tudo muda a cada render:
       para GitOps, traga o seu Secret em existingSecret. */ -}}
{{- $name := include "sb.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keys := dict
      "dbAdminPassword" 32 "dbAppPassword" 32 "apiToken" 48 "secretKey" 64 "panelPassword" 16
      "wpDbPassword" 32 "wpDbRootPassword" 32 "wpAdminPassword" 20 "wpAppPassword" 24
      "searxngSecret" 48 }}
{{- $vals := dict }}
{{- range $k, $len := $keys }}
{{- $_ := set $vals $k (index $old $k | default (randAlphaNum (int $len) | b64enc)) }}
{{- end }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sb.labels" . | nindent 4 }}
  annotations:
    # Fica mesmo com `helm uninstall`: sem o secretKey o cofre do portal fica ilegível.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $k, $_ := $keys }}
  {{ $k }}: {{ index $vals $k | quote }}
{{- end }}
---
{{- end }}
# settings.yml do SearXNG, com a chave do Secret principal.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sb.fullname" . }}-searxng
  labels:
    {{- include "sb.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "shortsblog"
    server:
      secret_key: {{ index $vals "searxngSecret" | b64dec | quote }}
      limiter: false
      public_instance: false
      image_proxy: false
    search:
      safe_search: 0
      formats: [html, json]
